name: Continuous Integration

on:
  pull_request:
    branches:
      - main
    paths:
      - "**"
      - "!/*.md"
      - "!/**.md"

concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

jobs:
  integrity:
    name: Integrity Checks on Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        toolchain:
          - stable
          - nightly

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      # The default build never compiles the optional Bevy integration, so a Bevy
      # upgrade can break it without the steps above noticing.
      - name: Clippy with Bevy integration
        if: matrix.toolchain == 'stable'
        run: cargo clippy --features bevy --all-targets -- -D warnings

      - name: Test with Bevy integration
        if: matrix.toolchain == 'stable'
        run: cargo test --features bevy

      # Deliberately not built here: the `rerun` feature is the local Rerun-viewer
      # debugging integration, and it should stay out of CI. That leaves
      # `src/rerun_impl.rs` and the `#[cfg(feature = "rerun")]` call sites unbuilt
      # by every job above, so check them by hand when touching them:
      # `cargo clippy --features rerun -- -D warnings`. The panic fixed in 5f4ee2c
      # was in code no job compiles.
