[package]
categories = ["algorithms", "graphics", "mathematics"]
description = "Fast halfedge triangle mesh graph in pure Rust "
edition = "2024"
exclude = [".agents/", ".github/", ".idea/", ".zed/", "examples/", "tests/"]
keywords = ["3D", "halfedge-graph", "mesh", "real-time", "topology"]
license = "MIT"
name = "mesh-graph"
readme = "README.md"
repository = "https://github.com/Synphonyte/mesh-graph"
version = "0.12.0"

[dependencies]
anyhow = { version = "1", optional = true }
bevy = { version = "0.20", default-features = false, features = [
    "bevy_asset",
    "bevy_mesh",
], optional = true }
cfg-if = { version = "1", optional = true }
foldhash = "0.2"
glam = "0.34"
gltf = { version = "1.4", optional = true, features = ["extras"] }
# No `default-hasher`: the crate uses the fixed-seed aliases in `src/hash.rs`. Other
# dependencies (parry3d) enable it anyway, so `clippy.toml` is what enforces the aliases.
hashbrown = { version = "0.17", default-features = false, features = [
    "allocator-api2",
    "equivalent",
    "inline-more",
    "raw-entry",
] }
itertools = "0.15"
lazy_static = { version = "1.5", optional = true }
manifold-csg = { version = "0.4", default-features = false, optional = true }
ordered-float = "5"
parry3d = "0.31"
rerun = { version = "0.43", default-features = false, optional = true, features = [
    "sdk",
] }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
slotmap = "1"
tracing = { version = "0.1", features = ["release_max_level_off"] }
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
], optional = true }

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
bevy = ["dep:bevy"]
default = []
gltf = ["dep:gltf", "dep:anyhow"]
rerun = ["dep:cfg-if", "dep:lazy_static", "dep:rerun"]
serde = ["dep:serde", "glam/serde", "hashbrown/serde", "slotmap/serde"]
manifold = ["dep:manifold-csg"]
# Topology-corruption instrumentation: chain/twin/outgoing-list validators at every
# op end, optional state-history ring, state dump/resume. Requires `serde` (state
# files are JSON). Enabling the feature enables the probes; expect a much slower
# build. Only for debugging mesh corruption — never enable for a release.
instrumentation = ["serde", "dep:anyhow", "dep:serde_json"]

# Dev-only debug binary: also needs the implicit `tracing-subscriber` feature
# (the optional dependency) for its tracing setup.
[[bin]]
name = "vertex-neighborhood"
path = "src/bin/vn.rs"
required-features = ["gltf", "tracing-subscriber"]
